<title>أسرة البابا أثناسيوس – الحفلة والروابط</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f8f3;--card:#fff;--text:#16261b;--muted:#5b6b60;--g:#1b9a4a;--g2:#0f6b32;--line:#dbe8de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1710;--card:#16231a;--text:#eaf4ec;--muted:#9db3a2;--g:#3ccf74;--g2:#1b9a4a;--line:#25382b}}
:root[data-theme="dark"]{--bg:#0e1710;--card:#16231a;--text:#eaf4ec;--muted:#9db3a2;--g:#3ccf74;--g2:#1b9a4a;--line:#25382b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px}
main{width:100%;max-width:440px;text-align:center}
.logo{width:120px;height:120px;border-radius:50%;background:#fff;padding:6px;border:3px solid var(--g);animation:float 4s ease-in-out infinite}
h1{font-size:24px;margin:12px 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 22px}
.party{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:22px;padding:20px;margin-bottom:18px;animation:rise .8s .1s both}
.party b{display:block;font-size:20px}
.party span{opacity:.95}
.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;text-align:right;transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .8s both}
.link:nth-of-type(1){animation-delay:.25s}.link:nth-of-type(2){animation-delay:.4s}.link:nth-of-type(3){animation-delay:.55s}
.link:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(27,154,74,.22);border-color:var(--g)}
.link .ic{font-size:30px}
.link b{display:block;font-size:17px}
.link small{color:var(--muted)}
.link .ar{margin-inline-start:auto;color:var(--g);font-size:20px}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
